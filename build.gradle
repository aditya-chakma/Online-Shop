plugins {
    id 'java'
    id 'war'
    id 'org.akhikhl.gretty' version '2.0.0'
}

sourceCompatibility = 1.8
targetCompatibility = 1.8

def springVersion = '5.3.5'
def hibernateVersion = '5.4.20.Final'

repositories {
    mavenCentral()
}

gretty {
    contextPath = '/'
}

dependencies {
    runtimeOnly group: 'mysql', name: 'mysql-connector-java', version: '8.0.23'

    implementation group: 'commons-fileupload', name: 'commons-fileupload', version: '1.3.1'
    implementation group: 'commons-io', name: 'commons-io', version: '2.6'

    implementation group: 'opensymphony', name: 'sitemesh', version: '2.4.2'

    implementation group: 'org.hibernate', name: 'hibernate-core', version: "$hibernateVersion"
    implementation group: 'org.hibernate', name: 'hibernate-entitymanager', version: "$hibernateVersion"
    implementation group: 'org.hibernate.validator', name: 'hibernate-validator', version: '6.2.0.Final'

    implementation group: 'javax.validation', name: 'validation-api', version: '2.0.1.Final'
    compileOnly group: 'javax.servlet', name:'javax.servlet-api', version:'4.0.1'

    implementation group: 'jstl', name: 'jstl', version: '1.2'

    implementation group: 'org.springframework', name: 'spring-core', version: "$springVersion"
    implementation group: 'org.springframework', name: 'spring-webmvc', version: "$springVersion"
    implementation group: 'org.springframework', name: 'spring-orm', version: "$springVersion"
    implementation group: 'org.springframework', name: 'spring-tx', version: "$springVersion"
    implementation group: 'org.springframework', name: 'spring-context', version: "$springVersion"

    implementation group: 'log4j', name: 'log4j', version: '1.2.17'

    implementation group: 'commons-fileupload', name: 'commons-fileupload', version: '1.3.1'
    implementation group: 'commons-io', name: 'commons-io', version: '2.6'

    implementation group: 'org.springframework.security', name: 'spring-security-crypto', version: '5.3.5.RELEASE'

}